spring.application.name=drones
server.port=8080

# --- Connexion MySQL (adapter username / password si besoin) ---
spring.datasource.url=jdbc:mysql://localhost:3306/drones_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
